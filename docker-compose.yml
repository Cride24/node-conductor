services:
  postgres:
    image: postgres:16-alpine
    container_name: nodeconductor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodeconductor
      POSTGRES_USER: nodeconductor
      POSTGRES_PASSWORD: nodeconductor_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
